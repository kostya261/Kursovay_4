<!-- templates/mailings/message_confirm_delete.html -->
{% extends 'base.html' %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-danger">Удаление сообщения</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Вы уверены, что хотите удалить сообщение?</p>
                <p><strong>{{ object.subject }}</strong></p>
                <div class="alert alert-warning">
                    <small>
                        <strong>Внимание:</strong> Это сообщение используется в
                        {{ object.mailings.count }} рассылках.
                    </small>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'mailer:message_list' %}" class="btn btn-secondary">
                            Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            Да, удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
