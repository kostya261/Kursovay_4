{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="bi bi-shield-check"></i> Новый пароль</h4>
                </div>
                <div class="card-body">
                    {% if user_email %}
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Установка нового пароля для: <strong>{{ user_email }}</strong>
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">Новый пароль</label>
                            <input type="password"
                                   name="new_password1"
                                   class="form-control"
                                   id="id_new_password1"
                                   required
                                   placeholder="Минимум 8 символов">
                            <div class="form-text">Пароль должен содержать не менее 8 символов</div>
                        </div>

                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">Подтверждение пароля</label>
                            <input type="password"
                                   name="new_password2"
                                   class="form-control"
                                   id="id_new_password2"
                                   required
                                   placeholder="Повторите пароль">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Установить новый пароль
                            </button>
                            <a href="{% url 'users:password_reset' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Вернуться назад
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
